[package]
name = "scarp-playground-wasm"
version = "0.0.2"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
scarp = { git = "https://github.com/scarp-lang/scarp", rev = "44a3bb0a91e67570e46ce058a3f6211f8e5db0f5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2.100"
