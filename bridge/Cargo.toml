[package]
name = "scarp-playground-wasm"
version = "0.0.2"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
scarp = { git = "https://github.com/scarp-lang/scarp", rev = "205e92f166f186c3905e5880d41c31717b697b8e" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2.100"
