[package]
name = "scarp-playground-wasm"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
scarp = { git = "https://github.com/scarp-lang/scarp", rev = "79141329176f5dce51457e90a6652902f6432135" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2.100"
