[package]
name = "scarp-playground-wasm"
version = "0.0.2"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
scarp = { git = "https://github.com/scarp-lang/scarp", rev = "cdf6a3924ec2a36c7beca5a9aec4f01a0bce515e" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2.100"
