[package]
name = "scarp-playground-wasm"
version = "0.0.2"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
scarp = { git = "https://github.com/scarp-lang/scarp", rev = "244f713b4fa48f02a98b8e3e3c11025363f35260" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2.100"
