name: Publish explicitly authorized alpha

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Pre-release tag (this preview supports v0.0.1 only)"
        required: true
        default: "v0.0.1"

permissions:
  contents: write

jobs:
  alpha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard release policy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          test "$REQUESTED_VERSION" = "v0.0.1"
          test "$(node -p "require('./package.json').version")" = "0.0.1"
          grep -Fq '7715c28df09c7703b39e14fddb963275b25df476' bridge/Cargo.toml
          if gh release view "$REQUESTED_VERSION" >/dev/null 2>&1; then
            echo "Refusing to overwrite an existing release" >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: npm install --no-audit --no-fund
      - run: npm run lint && npm run typecheck && npm run test
      - run: cargo test --manifest-path bridge/Cargo.toml
      - run: cargo install wasm-pack --locked
      - run: wasm-pack build bridge --release --target web --out-dir ../public/compiler
      - run: npm run build
      - name: Package verified static website
        run: |
          test -s dist/compiler/scarp_playground_wasm_bg.wasm
          tar -czf scarp-playground-v0.0.1-web.tar.gz -C dist .
          sha256sum scarp-playground-v0.0.1-web.tar.gz > scarp-playground-v0.0.1-web.tar.gz.sha256
      - name: Publish alpha only, never stable
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          gh release create "$REQUESTED_VERSION"             scarp-playground-v0.0.1-web.tar.gz             scarp-playground-v0.0.1-web.tar.gz.sha256             --prerelease --target "$GITHUB_SHA" --title "Scarp Playground v0.0.1 (alpha)"             --notes "Experimental browser playground using the real Scarp v0.0.5-alpha.3 interpreter pinned to commit 7715c28df09c7703b39e14fddb963275b25df476. Not a stable release. Runs in-browser with execution limits; see README for security and compatibility details."
