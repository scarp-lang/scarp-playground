name: Publish approved v0.0.2 alpha

on:
  push:
    branches: [main]
    paths:
      - .github/release-intents/v0.0.2.json
  workflow_dispatch:
    inputs:
      version:
        description: "Pre-release tag (this preview supports v0.0.2 only)"
        required: true
        default: "v0.0.2"

permissions:
  contents: write

concurrency:
  group: playground-approved-v0.0.2-alpha
  cancel-in-progress: false

jobs:
  alpha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard alpha release policy and compiler revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version || 'v0.0.2' }}
        run: |
          test "$REQUESTED_VERSION" = "v0.0.2"
          test "$GITHUB_REF" = "refs/heads/main"
          test -s .github/release-intents/v0.0.2.json
          test "$(node -p "require('./package.json').version")" = "0.0.2"
          test "$(node -p "require('./package-lock.json').version")" = "0.0.2"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "0.0.2"
          grep -Fq 'version = "0.0.2"' bridge/Cargo.toml
          grep -Fq 'version = "0.0.2"' bridge/Cargo.lock
          grep -Fq '79141329176f5dce51457e90a6652902f6432135' bridge/Cargo.toml
          node -e "const a=require('./.github/release-intents/v0.0.2.json'); if(a.tag!=='v0.0.2'||a.compiler_commit!=='79141329176f5dce51457e90a6652902f6432135'||a.status!=='alpha pre-release only') process.exit(1)"
          if git ls-remote --exit-code --tags origin "refs/tags/$REQUESTED_VERSION" >/dev/null 2>&1; then
            echo "Refusing to reuse an existing tag" >&2
            exit 1
          fi
          if gh release view "$REQUESTED_VERSION" >/dev/null 2>&1; then
            echo "Refusing to overwrite an existing release" >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: npm ci --no-audit --no-fund
      - run: npm run lint && npm run typecheck && npm run test
      - run: cargo test --locked --manifest-path bridge/Cargo.toml
      - run: cargo install wasm-pack --locked
      - run: wasm-pack build bridge --release --target web --out-dir ../public/compiler --locked
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Package verified static website
        run: |
          test -s dist/compiler/scarp_playground_wasm_bg.wasm
          tar -czf scarp-playground-v0.0.2-web.tar.gz -C dist .
          sha256sum scarp-playground-v0.0.2-web.tar.gz > scarp-playground-v0.0.2-web.tar.gz.sha256
          sha256sum -c scarp-playground-v0.0.2-web.tar.gz.sha256
      - name: Publish alpha only, never stable
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          gh release create "$REQUESTED_VERSION" \
            scarp-playground-v0.0.2-web.tar.gz \
            scarp-playground-v0.0.2-web.tar.gz.sha256 \
            --prerelease --target "$GITHUB_SHA" \
            --title "Scarp Playground v0.0.2 (alpha)" \
            --notes-file docs/releases/v0.0.2-alpha.md
