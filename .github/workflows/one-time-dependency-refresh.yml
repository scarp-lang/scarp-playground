name: One-time reviewed dependency lockfile refresh
on:
  push:
    branches:
      - security/auditable-locked-dependencies

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message == 'ci(deps): run one-time audited Vitest refresh'
    runs-on: ubuntu-latest
    steps:
      - name: Check out only the review branch
        uses: actions/checkout@v4
        with:
          ref: security/auditable-locked-dependencies
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate the lock with an explicitly reviewed Vitest major
        run: npm install --package-lock-only --ignore-scripts --save-dev 'vitest@^5.1.0'
      - name: Require no known high or critical npm advisories
        run: npm audit --audit-level=high
      - name: Commit only the reviewed manifest and lockfile delta
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(deps): upgrade vulnerable Vitest test toolchain'
            git push origin HEAD:security/auditable-locked-dependencies
          fi
