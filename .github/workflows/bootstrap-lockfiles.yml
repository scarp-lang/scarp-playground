name: Generate reproducible lockfiles (temporary development workflow)

on:
  push:
    branches:
      - feat/browser-e2e-and-lockfiles
    paths:
      - package.json
      - bridge/Cargo.toml
      - .github/workflows/bootstrap-lockfiles.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve and freeze npm dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Resolve and freeze Rust dependencies
        run: cargo generate-lockfile --manifest-path bridge/Cargo.toml
      - name: Commit lockfiles to the feature branch
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add package-lock.json bridge/Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "build: lock verified browser and Rust dependencies"
            git push origin HEAD:refs/heads/feat/browser-e2e-and-lockfiles
          fi
